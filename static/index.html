<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Polly Remote — KissToy Cloud Relay</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0d0d1a; color: #e0e0e0;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 16px;
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        .container {
            background: #13132b; border-radius: 24px; padding: 28px 24px;
            max-width: 400px; width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 1.4em; color: #ff6b8a; letter-spacing: 1px; }
        .header .info { font-size: 0.7em; color: #555; margin-top: 4px; }

        .status-row { display: flex; gap: 8px; margin-bottom: 20px; }
        .badge { flex: 1; text-align: center; padding: 6px 0; border-radius: 20px;
            font-size: 0.75em; font-weight: 600; transition: all 0.3s; background: #1a1a3a; }
        .badge.on-relay { background: #0a2e1a; color: #4ecca3; }
        .badge.off-relay { background: #2e0a0a; color: #ff6b8a; }
        .badge.on-ctrl { background: #0a1a2e; color: #4ea9cc; }

        .motor-card {
            background: #1a1a35; border-radius: 16px; padding: 20px;
            margin-bottom: 16px; border: 1px solid #252545;
        }
        .motor-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .motor-label .name { font-weight: 600; font-size: 1em; }
        .motor-label .value {
            padding: 4px 14px; border-radius: 20px; font-weight: bold;
            font-size: 0.9em; min-width: 50px; text-align: center;
        }
        .val-vibe { background: #ff6b8a; color: #fff; }
        .val-suction { background: #9b59b6; color: #fff; }

        input[type="range"] {
            -webkit-appearance: none; width: 100%; height: 10px;
            border-radius: 5px; outline: none; margin: 6px 0;
        }
        #slider1 { background: linear-gradient(to right, #1a1a35, #ff6b8a); }
        #slider1::-webkit-slider-thumb {
            -webkit-appearance: none; width: 36px; height: 36px;
            border-radius: 50%; background: #ff6b8a; cursor: pointer;
            box-shadow: 0 0 20px rgba(255,107,138,0.4); border: 2px solid #fff;
        }
        #slider3 { background: linear-gradient(to right, #1a1a35, #9b59b6); }
        #slider3::-webkit-slider-thumb {
            -webkit-appearance: none; width: 36px; height: 36px;
            border-radius: 50%; background: #9b59b6; cursor: pointer;
            box-shadow: 0 0 20px rgba(155,89,182,0.4); border: 2px solid #fff;
        }

        .quick-row { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
        .quick-btn {
            flex: 1; min-width: 50px; padding: 10px 0; border: 1px solid #333;
            border-radius: 12px; background: #1a1a35; color: #ccc;
            font-size: 0.78em; font-weight: 600; cursor: pointer;
            transition: all 0.15s; text-align: center;
        }
        .quick-btn:active { transform: scale(0.95); }
        .quick-btn.vibe:active { background: #ff6b8a33; border-color: #ff6b8a; }
        .quick-btn.suck:active { background: #9b59b633; border-color: #9b59b6; }

        .btn-stop {
            width: 100%; padding: 14px; margin-top: 16px; border: none;
            border-radius: 14px; font-size: 1em; font-weight: bold; cursor: pointer;
            background: #ff6b8a; color: #fff; letter-spacing: 2px;
        }
        .btn-stop:active { transform: scale(0.97); background: #e05575; }

        .config {
            margin-top: 20px; padding-top: 12px; border-top: 1px solid #1a1a35;
        }
        .config input {
            width: 100%; padding: 8px 10px; margin-top: 3px; border-radius: 8px;
            border: 1px solid #252545; background: #0d0d1a; color: #ccc; font-size: 0.78em;
        }
        .config label { font-size: 0.7em; color: #555; }

        .log-area {
            margin-top: 12px; max-height: 70px; overflow-y: auto;
            font-size: 0.65em; color: #444; font-family: monospace;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔌 Polly Remote</h1>
            <div class="info">KissToy Cloud Relay · polly-bridge</div>
        </div>

        <div class="status-row">
            <div class="badge off-relay" id="badgeRelay">🔌 Relay Offline</div>
            <div class="badge" id="badgeCtrl">📡 Connecting...</div>
        </div>

        <!-- Motor 1: Vibration -->
        <div class="motor-card">
            <div class="motor-label">
                <div class="name">🫧 Motor 1 · 震动</div>
                <div class="value val-vibe" id="val1">0</div>
            </div>
            <input type="range" id="slider1" min="0" max="100" step="5" value="0" disabled>
            <div class="quick-row">
                <button class="quick-btn vibe" data-m="1" data-v="20">20</button>
                <button class="quick-btn vibe" data-m="1" data-v="40">40</button>
                <button class="quick-btn vibe" data-m="1" data-v="60">60</button>
                <button class="quick-btn vibe" data-m="1" data-v="80">80</button>
                <button class="quick-btn vibe" data-m="1" data-v="100">MAX</button>
            </div>
        </div>

        <!-- Motor 3: Suction -->
        <div class="motor-card">
            <div class="motor-label">
                <div class="name">💨 Motor 3 · 吮吸</div>
                <div class="value val-suction" id="val3">0</div>
            </div>
            <input type="range" id="slider3" min="0" max="100" step="5" value="0" disabled>
            <div class="quick-row">
                <button class="quick-btn suck" data-m="3" data-v="20">20</button>
                <button class="quick-btn suck" data-m="3" data-v="40">40</button>
                <button class="quick-btn suck" data-m="3" data-v="60">60</button>
                <button class="quick-btn suck" data-m="3" data-v="80">80</button>
                <button class="quick-btn suck" data-m="3" data-v="100">MAX</button>
            </div>
        </div>

        <button class="btn-stop" id="btnStop">⏹ STOP ALL</button>

        <div class="config">
            <label>Group</label>
            <input type="text" id="groupId" value="82e0ff7c8e3dabe932332e6ea65d272d">
            <label>User ID (from link: id=...)</label>
            <input type="text" id="userId" value="756801">
            <label>Device ID</label>
            <input type="text" id="deviceId" value="33">
        </div>

        <div class="log-area" id="log"></div>
    </div>

    <script>
        const $ = id => document.getElementById(id);
        let ws = null, pingTimer = null, currentMotors = {};

        // Auto-fill from URL params: ?group=...&id=...&device_id=...
        (function() {
            const p = new URLSearchParams(window.location.search);
            if (p.get('group')) $('groupId').value = p.get('group');
            if (p.get('id')) $('userId').value = p.get('id');
            if (p.get('device_id')) $('deviceId').value = p.get('device_id');
        })();

        function log(msg) {
            const el = $('log');
            el.innerHTML = `[${new Date().toLocaleTimeString()}] ${msg}<br>` + el.innerHTML;
            if (el.children.length > 30) el.removeChild(el.lastChild);
        }

        function setBadge(id, text, cls) {
            const el = $(id);
            el.textContent = text;
            el.className = 'badge ' + cls;
        }

        function quantize(v) { return v === 0 ? 0 : Math.max(5, Math.round(v / 5) * 5); }

        function sendCommand(motors) {
            if (!ws || ws.readyState !== WebSocket.OPEN) { log('⚠ Not connected'); return; }
            const qMotors = {};
            for (const [k, v] of Object.entries(motors)) qMotors[k] = quantize(parseInt(v));
            if (JSON.stringify(qMotors) === JSON.stringify(currentMotors)) return;
            currentMotors = {...qMotors};

            ws.send(JSON.stringify({
                event: "control",
                data: {
                    target: $('groupId').value,
                    device_id: $('deviceId').value,
                    motors: qMotors,
                }
            }));
            log(`→ M1=${qMotors['1']??0} M3=${qMotors['3']??0}`);
        }

        function setupSlider(sid, vid, mid) {
            const slider = $(sid);
            let timeout;
            slider.addEventListener('input', () => {
                $(vid).textContent = slider.value;
                clearTimeout(timeout);
                timeout = setTimeout(() => sendCommand({[mid]: slider.value}), 80);
            });
            slider.addEventListener('change', () => {
                clearTimeout(timeout);
                sendCommand({[mid]: slider.value});
            });
        }
        setupSlider('slider1', 'val1', '1');
        setupSlider('slider3', 'val3', '3');

        document.querySelectorAll('.quick-btn').forEach(b => {
            b.addEventListener('click', () => {
                const m = b.dataset.m, v = parseInt(b.dataset.v);
                $(`slider${m}`).value = v;
                $(`val${m}`).textContent = v;
                sendCommand({[m]: v});
            });
        });

        $('btnStop').addEventListener('click', () => {
            ['1','3'].forEach(m => {
                $(`slider${m}`).value = 0;
                $(`val${m}`).textContent = '0';
            });
            sendCommand({'1': 0, '3': 0});
            currentMotors = {};
            log('⏹ STOP');
        });

        function connect() {
            if (ws) ws.close();
            if (pingTimer) clearInterval(pingTimer);

            const group = $('groupId').value;
            const uid = $('userId').value;
            if (!group) { log('⚠ Group required'); return; }

            const wsUrl = `wss://polly-bridge.onrender.com/websocket-kisstoy?group=${encodeURIComponent(group)}&id=${encodeURIComponent(uid)}`;
            log(`Connecting...`);
            setBadge('badgeCtrl', '📡 Connecting...', '');

            ws = new WebSocket(wsUrl);
            ws.onopen = () => {
                log('✓ Connected to polly-bridge');
                setBadge('badgeCtrl', '📡 Connected', 'on-ctrl');
                $('slider1').disabled = false;
                $('slider3').disabled = false;
                pingTimer = setInterval(() => { if (ws.readyState === 1) ws.send('ping'); }, 10000);
            };
            ws.onmessage = (e) => {
                if (e.data === 'pong') return;
                try {
                    const msg = JSON.parse(e.data);
                    const ev = msg.event;
                    if (ev === 'relay_online' || ev === 'device_online') {
                        setBadge('badgeRelay', '🔌 Relay Online', 'on-relay');
                        log('✓ Relay online');
                    } else if (ev === 'relay_offline' || ev === 'device_offline') {
                        setBadge('badgeRelay', '🔌 Relay Offline', 'off-relay');
                        log('✗ Relay offline');
                    } else if (ev === 'ack') {
                        const r = msg.data?.relayed;
                        log(r ? '✓ Relayed' : '✗ Relay failed: ' + (msg.data?.message || ''));
                    }
                } catch(ex) {}
            };
            ws.onclose = (e) => {
                log(`Disconnected (${e.code}). Reconnecting in 5s...`);
                setBadge('badgeCtrl', '📡 Offline', '');
                setBadge('badgeRelay', '🔌 Relay Offline', 'off-relay');
                if (pingTimer) clearInterval(pingTimer);
                ws = null;
                $('slider1').disabled = true;
                $('slider3').disabled = true;
                setTimeout(connect, 5000);
            };
            ws.onerror = () => log('⚠ Connection error');
        }

        connect();
    </script>
</body>
</html>
